[package]
name = "ani-player"
version = "1.0.0"
edition = "2024"
default-run = "ani-player"
autobins = false

[features]
windows-setup = []

[[bin]]
name = "ani-player"
path = "src/main.rs"

[[bin]]
name = "ani-setup"
path = "src/bin/ani-setup.rs"
required-features = ["windows-setup"]

[[bin]]
name = "yt-dlp"
path = "src/bin/yt-dlp.rs"
required-features = ["windows-setup"]

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
egui_extras = { version = "0.31.1", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Input_XboxController"] }
