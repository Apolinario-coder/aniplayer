name: Packages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release_1_0:
        description: Publish the existing Release 1.0 draft after all package jobs succeed
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev mpv ffmpeg python3 xvfb
      - run: rustup update stable
      - run: cargo +stable test --release --locked
      - run: cargo +stable test --release --locked playback_motion_export_and_stream -- --ignored
      - run: cargo +stable build --release --locked
      - run: |
          curl -fL --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" bash installer/linux.sh
          APPIMAGE_EXTRACT_AND_RUN=1 ANI_PLAYER_CONFIG="$RUNNER_TEMP/ani-config" ANI_PREVIEW="$RUNNER_TEMP/ani-linux.png" timeout 30s xvfb-run -a dist/*.AppImage
          test -s "$RUNNER_TEMP/ani-linux.png"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup target add --toolchain stable aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo +stable test --release --locked
      - run: |
          cargo +stable build --release --locked --target aarch64-apple-darwin
          cargo +stable build --release --locked --target x86_64-apple-darwin
          bash installer/macos.sh
          pkgutil --expand-full dist/*.pkg "$RUNNER_TEMP/pkg"
          lipo -verify_arch arm64 x86_64 "$RUNNER_TEMP/pkg/Payload/Ani Player.app/Contents/MacOS/ani-player"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.pkg
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo +stable test --release --locked --features windows-setup
      - run: cargo +stable build --release --locked
      - shell: pwsh
        run: |
          $version = (cargo +stable metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          New-Item -ItemType Directory -Force dist,dist/stage | Out-Null
          Copy-Item 'target/release/ani-player.exe' 'dist/stage/Ani Player.exe'
          Copy-Item 'assets/i18n/Noto-OFL.txt' 'dist/stage/'
          Copy-Item 'assets/anime4k/LICENSE' 'dist/stage/Anime4K-LICENSE'
          Copy-Item 'assets/icons/LICENSE' 'dist/stage/Lucide-LICENSE'
          Compress-Archive -Path 'dist/stage/*' -DestinationPath "dist/Ani-Player-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish_release_1_0 && github.ref == 'refs/heads/main' }}
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.draft and .tag_name == "v1.0.0") | .id')
          test -n "$release_id"
          gh api "repos/$GH_REPO/releases/$release_id" --jq '.target_commitish' | grep -Fx "$GITHUB_SHA"
          for asset in Ani-Player-1.0.0-windows-x64.zip Ani-Player-1.0.0-linux-x86_64.AppImage Ani-Player-1.0.0-macOS-universal.pkg; do
            test -s "release/$asset"
            if ! gh api "repos/$GH_REPO/releases/$release_id/assets" --jq '.[].name' | grep -Fx "$asset"; then
              gh api --method POST -H 'Content-Type: application/octet-stream' --input "release/$asset" \
                "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$asset" --jq .name
            fi
          done
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false --jq .html_url
