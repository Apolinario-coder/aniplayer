name: Packages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release_1_0:
        description: Publish the existing Release 1.0 draft after all package jobs succeed
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev mpv ffmpeg python3 python3-dev python3-pip cython3 xvfb desktop-file-utils squashfs-tools autoconf automake libtool pkg-config libzimg-dev libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libass-dev libplacebo-dev libxrandr-dev libxinerama-dev libxpresent-dev libxss-dev libpulse-dev libasound2-dev libvulkan1 mesa-vulkan-drivers libluajit-5.1-dev
          python3 -m pip install meson==1.5.2 ninja
      - run: rustup update stable
      - uses: actions/cache/restore@v4
        id: linux-media-cache
        with:
          path: ${{ runner.temp }}/media
          key: linux-media-${{ hashFiles('installer/prepare-linux-media.sh') }}
      - if: steps.linux-media-cache.outputs.cache-hit != 'true'
        run: bash installer/prepare-linux-media.sh "$RUNNER_TEMP/media"
      - if: steps.linux-media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/media
          key: linux-media-${{ hashFiles('installer/prepare-linux-media.sh') }}
      - run: |
          "$RUNNER_TEMP/media/bin/python3" installer/check-mpv.py "$RUNNER_TEMP/media"
      - run: ANI_TEST_RIFE_FRAMES=1 "$RUNNER_TEMP/media/bin/python3" installer/check-rife.py "$RUNNER_TEMP/media"
      - run: |
          echo "ANI_MEDIA_DIR=$RUNNER_TEMP/media" >> "$GITHUB_ENV"
          echo "ANI_LINUX_MEDIA_DIR=$RUNNER_TEMP/media" >> "$GITHUB_ENV"
          echo "ANI_RIFE_DIR=$RUNNER_TEMP/media/rife" >> "$GITHUB_ENV"
      - run: cargo +stable test --release --locked
      - run: cargo +stable test --release --locked playback_motion_export_and_stream -- --ignored
      - run: cargo +stable build --release --locked
      - run: |
          curl -fL --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" bash installer/linux.sh
          APPIMAGE_EXTRACT_AND_RUN=1 ANI_PLAYER_CONFIG="$RUNNER_TEMP/ani-config" ANI_PREVIEW="$RUNNER_TEMP/ani-linux.png" timeout 30s xvfb-run -a dist/*.AppImage
          test -s "$RUNNER_TEMP/ani-linux.png"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  macos:
    needs: [macos-media]
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-media-*
          path: media
      - run: |
          mkdir -p "$RUNNER_TEMP/media/arm64" "$RUNNER_TEMP/media/x86_64"
          tar -xf media/macos-media-arm64/media.tar -C "$RUNNER_TEMP/media/arm64"
          tar -xf media/macos-media-x86_64/media.tar -C "$RUNNER_TEMP/media/x86_64"
          echo "ANI_MAC_MEDIA_DIR=$RUNNER_TEMP/media" >> "$GITHUB_ENV"
          echo "ANI_MEDIA_DIR=$RUNNER_TEMP/media/$(uname -m)" >> "$GITHUB_ENV"
      - run: rustup update stable && rustup target add --toolchain stable aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo +stable test --release --locked
      - run: cargo +stable test --release --locked playback_motion_export_and_stream -- --ignored
      - run: |
          cargo +stable build --release --locked --target aarch64-apple-darwin
          cargo +stable build --release --locked --target x86_64-apple-darwin
          bash installer/macos.sh
          pkgutil --expand-full dist/*.pkg "$RUNNER_TEMP/pkg"
          lipo "$RUNNER_TEMP/pkg/Payload/Ani Player.app/Contents/MacOS/ani-player" -verify_arch arm64 x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.pkg
          if-no-files-found: error

  macos-media:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install mpv ffmpeg molten-vk
      - run: |
          python="$(brew --prefix)/bin/python3"
          "$python" installer/prepare-macos-media.py "$RUNNER_TEMP/media"
          mv "$RUNNER_TEMP/media" "$RUNNER_TEMP/relocated media"
          env PATH=/usr/bin:/bin "$RUNNER_TEMP/relocated media/bin/mpv" --vf=help | grep vapoursynth
          env PATH=/usr/bin:/bin "$RUNNER_TEMP/relocated media/bin/python3" -c 'import vapoursynth; print(vapoursynth.core.version())'
          env PATH=/usr/bin:/bin "$RUNNER_TEMP/relocated media/bin/python3" installer/check-rife.py "$RUNNER_TEMP/relocated media"
          env PATH=/usr/bin:/bin "$RUNNER_TEMP/relocated media/bin/python3" installer/check-mpv.py "$RUNNER_TEMP/relocated media"
          env PATH=/usr/bin:/bin "$RUNNER_TEMP/relocated media/bin/ffmpeg" -v error -f lavfi -i color=s=64x64 -t 0.1 -f null -
          tar -cf media.tar -C "$RUNNER_TEMP/relocated media" .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-media-${{ matrix.arch }}
          path: media.tar

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo +stable test --release --locked --features windows-setup
      - shell: pwsh
        run: ./installer/Build-Installer.ps1 -ReleaseRuntime
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-windows-x64-setup.exe
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish_release_1_0 && github.ref == 'refs/heads/main' }}
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.draft and .tag_name == "v1.0.0") | .id')
          test -n "$release_id"
          gh api "repos/$GH_REPO/releases/$release_id" --jq '.target_commitish' | grep -Fx "$GITHUB_SHA"
          for asset in Ani-Player-1.0.0-windows-x64-setup.exe Ani-Player-1.0.0-linux-x86_64.AppImage Ani-Player-1.0.0-macOS-universal.pkg; do
            test -s "release/$asset"
            if ! gh api "repos/$GH_REPO/releases/$release_id/assets" --jq '.[].name' | grep -Fx "$asset"; then
              gh api --method POST -H 'Content-Type: application/octet-stream' --input "release/$asset" \
                "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$asset" --jq .name
            fi
          done
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -f tag_name=v1.0.0 -F draft=false --jq .html_url
